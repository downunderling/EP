```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Realistic Flight Simulator</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#simulator {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

#world {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* ---------------- HUD ---------------- */

#hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    color: #00ff66;
    font-family: monospace;
    text-shadow: 0 0 5px black;
}

.panel {
    position: absolute;
    padding: 10px 14px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(0,255,100,.7);
    border-radius: 5px;
}

.label {
    font-size: 11px;
    opacity: .8;
}

.value {
    font-size: 25px;
    font-weight: bold;
}

#speed {
    left: 20px;
    top: 20px;
}

#altitude {
    right: 20px;
    top: 20px;
}

#heading {
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
}

#engine {
    left: 20px;
    bottom: 20px;
}

#flight {
    right: 20px;
    bottom: 20px;
}

/* ---------------- AIRCRAFT ---------------- */

#aircraft {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 140px;
    height: 6px;
    transform: translate(-50%, -50%);
}

#aircraft::before {
    content: "";
    position: absolute;
    width: 140px;
    height: 4px;
    top: 1px;
    background: white;
}

#aircraft::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 32px;
    left: 68px;
    top: -13px;
    background: white;
}

/* ---------------- CROSSHAIR ---------------- */

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 90px;
    height: 90px;
    transform: translate(-50%, -50%);
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: #00ff66;
}

#crosshair::before {
    width: 90px;
    height: 2px;
    top: 44px;
}

#crosshair::after {
    width: 2px;
    height: 90px;
    left: 44px;
}

/* ---------------- HELP ---------------- */

#help {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 15px;
    background: rgba(0,0,0,.6);
    color: white;
    border-radius: 5px;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="simulator">

<canvas id="world"></canvas>

<div id="hud">

    <div id="speed" class="panel">
        <div class="label">AIRSPEED</div>
        <div class="value">
            <span id="speedValue">120</span> KTS
        </div>
    </div>

    <div id="altitude" class="panel">
        <div class="label">ALTITUDE</div>
        <div class="value">
            <span id="altitudeValue">5000</span> FT
        </div>
    </div>

    <div id="heading" class="panel">
        HDG <span id="headingValue">000</span>°
    </div>

    <div id="engine" class="panel">
        <div class="label">THROTTLE</div>
        <div class="value">
            <span id="throttleValue">55</span>%
        </div>
    </div>

    <div id="flight" class="panel">
        <div class="label">FLIGHT CONTROL</div>
        PITCH: <span id="pitchValue">0</span>°<br>
        ROLL: <span id="rollValue">0</span>°<br>
        YAW: <span id="yawValue">0</span>°
    </div>

    <div id="crosshair"></div>
    <div id="aircraft"></div>

</div>

<div id="help">
W/S Pitch · A/D Roll · Q/E Yaw · ↑/↓ Throttle
</div>

</div>

<script>

const canvas =
    document.getElementById("world");

const ctx =
    canvas.getContext("2d");

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* =========================
   AIRCRAFT
========================= */

const aircraft = {

    altitude: 5000,

    speed: 120,

    heading: 0,

    pitch: 0,

    roll: 0,

    yaw: 0,

    throttle: 55,

    verticalSpeed: 0,

    fuel: 100

};

/* =========================
   KEYBOARD
========================= */

const keys = {};

window.addEventListener(
    "keydown",
    event => {

        keys[event.key.toLowerCase()] = true;

    }
);

window.addEventListener(
    "keyup",
    event => {

        keys[event.key.toLowerCase()] = false;

    }
);

/* =========================
   FLIGHT PHYSICS
========================= */

function updatePhysics(dt) {

    let pitchInput = 0;
    let rollInput = 0;
    let yawInput = 0;

    if (keys["w"])
        pitchInput = 1;

    if (keys["s"])
        pitchInput = -1;

    if (keys["a"])
        rollInput = -1;

    if (keys["d"])
        rollInput = 1;

    if (keys["q"])
        yawInput = -1;

    if (keys["e"])
        yawInput = 1;

    /* Throttle */

    if (keys["arrowup"])
        aircraft.throttle +=
            25 * dt;

    if (keys["arrowdown"])
        aircraft.throttle -=
            25 * dt;

    aircraft.throttle =
        Math.max(
            0,
            Math.min(
                100,
                aircraft.throttle
            )
        );

    /* Pitch */

    aircraft.pitch +=
        pitchInput *
        20 *
        dt;

    /* Roll */

    aircraft.roll +=
        rollInput *
        55 *
        dt;

    /* Yaw */

    aircraft.yaw +=
        yawInput *
        30 *
        dt;

    aircraft.heading +=
        aircraft.yaw *
        dt;

    /* Stability */

    aircraft.pitch *=
        Math.pow(.985, dt * 60);

    aircraft.roll *=
        Math.pow(.992, dt * 60);

    aircraft.yaw *=
        Math.pow(.96, dt * 60);

    /* Bank creates turn */

    aircraft.heading +=
        Math.sin(
            aircraft.roll *
            Math.PI /
            180
        ) *
        aircraft.speed *
        .015 *
        dt;

    /* Engine thrust */

    const thrust =
        aircraft.throttle / 100;

    const drag =
        .015 *
        aircraft.speed *
        aircraft.speed /
        100;

    const acceleration =
        thrust * 45 -
        drag;

    aircraft.speed +=
        acceleration * dt;

    aircraft.speed =
        Math.max(
            35,
            Math.min(
                650,
                aircraft.speed
            )
        );

    /* Lift */

    const pitchRadians =
        aircraft.pitch *
        Math.PI /
        180;

    const lift =
        Math.sin(
            pitchRadians
        ) *
        aircraft.speed *
        .75;

    const gravity = 32;

    aircraft.verticalSpeed =
        lift - gravity;

    aircraft.altitude +=
        aircraft.verticalSpeed *
        dt;

    /* Ground */

    if (aircraft.altitude < 0) {

        aircraft.altitude = 0;

        aircraft.speed *= .7;

    }

    /* Heading */

    aircraft.heading %= 360;

    if (aircraft.heading < 0)
        aircraft.heading += 360;

}

/* =========================
   WORLD
========================= */

function drawWorld() {

    const width =
        canvas.width;

    const height =
        canvas.height;

    const horizon =
        height / 2 -
        aircraft.pitch * 8;

    /* Sky */

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );

    sky.addColorStop(
        0,
        "#2673bd"
    );

    sky.addColorStop(
        .55,
        "#79ccef"
    );

    sky.addColorStop(
        1,
        "#d8f1ff"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    /* Mountains */

    drawMountains(
        width,
        horizon
    );

    /* Ground */

    ctx.save();

    ctx.translate(
        width / 2,
        horizon
    );

    ctx.rotate(
        aircraft.roll *
        Math.PI /
        180
    );

    ctx.fillStyle =
        "#416b3c";

    ctx.fillRect(
        -width * 2,
        0,
        width * 4,
        height * 2
    );

    /* Runway */

    ctx.fillStyle =
        "#444";

    ctx.beginPath();

    ctx.moveTo(-80, 0);
    ctx.lineTo(80, 0);
    ctx.lineTo(700, height * 2);
    ctx.lineTo(-700, height * 2);

    ctx.closePath();

    ctx.fill();

    /* Runway centerline */

    ctx.fillStyle =
        "white";

    for (
        let y = 50;
        y < height * 2;
        y += 100
    ) {

        const size =
            4 + y / 100;

        ctx.fillRect(
            -size / 2,
            y,
            size,
            40
        );

    }

    ctx.restore();

}

/* =========================
   MOUNTAINS
========================= */

function drawMountains(
    width,
    horizon
) {

    ctx.save();

    ctx.translate(
        -aircraft.heading * 2,
        0
    );

    ctx.fillStyle =
        "#46655e";

    ctx.beginPath();

    ctx.moveTo(
        -width,
        horizon
    );

    for (
        let x = -width;
        x < width * 2;
        x += 70
    ) {

        const mountainHeight =
            40 +
            Math.abs(
                Math.sin(
                    x * .012
                )
            ) * 150;

        ctx.lineTo(
            x,
            horizon -
            mountainHeight
        );

    }

    ctx.lineTo(
        width * 2,
        horizon
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}

/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById(
        "speedValue"
    ).textContent =
        Math.round(
            aircraft.speed
        );

    document.getElementById(
        "altitudeValue"
    ).textContent =
        Math.round(
            aircraft.altitude
        );

    document.getElementById(
        "headingValue"
    ).textContent =
        String(
            Math.round(
                aircraft.heading
            )
        ).padStart(
            3,
            "0"
        );

    document.getElementById(
        "throttleValue"
    ).textContent =
        Math.round(
            aircraft.throttle
        );

    document.getElementById(
        "pitchValue"
    ).textContent =
        aircraft.pitch.toFixed(1);

    document.getElementById(
        "rollValue"
    ).textContent =
        aircraft.roll.toFixed(1);

    document.getElementById(
        "yawValue"
    ).textContent =
        aircraft.yaw.toFixed(1);

}

/* =========================
   GAME LOOP
========================= */

let previousTime =
    performance.now();

function gameLoop(time) {

    const dt =
        Math.min(
            (time - previousTime) /
            1000,
            .05
        );

    previousTime = time;

    updatePhysics(dt);

    drawWorld();

    updateHUD();

    requestAnimationFrame(
        gameLoop
    );

}

requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
