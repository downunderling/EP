<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{overflow:hidden;background:#000;font-family:Segoe UI,Arial,sans-serif}
  #ui{position:absolute;inset:0;pointer-events:none;color:#fff;z-index:10}
  #hud{
    position:absolute;top:12px;left:12px;
    background:rgba(0,15,30,0.82);padding:12px 16px;border-radius:10px;
    font-size:13px;line-height:1.55;border:1px solid rgba(0,180,255,0.45);min-width:190px
  }
  #hud b{color:#00d4ff}
  .stall{color:#ff3b3b!important;animation:blink .4s infinite}
  @keyframes blink{50%{opacity:.25}}
  #selector{
    position:absolute;top:12px;right:12px;background:rgba(0,15,30,0.88);
    padding:12px;border-radius:10px;border:1px solid rgba(0,180,255,0.45);
    pointer-events:auto;width:210px
  }
  #selector h3{font-size:13px;margin-bottom:8px;color:#00d4ff}
  #selector button{
    display:block;width:100%;margin:4px 0;padding:8px 10px;
    background:rgba(0,90,160,0.45);border:1px solid #0077bb;color:#fff;
    border-radius:6px;cursor:pointer;font-size:12px;text-align:left;transition:.15s
  }
  #selector button:hover,#selector button.active{background:rgba(0,150,255,0.7);border-color:#00d4ff}
  #controls{
    position:absolute;bottom:14px;left:12px;background:rgba(0,15,30,0.75);
    padding:10px 14px;border-radius:8px;font-size:11px;line-height:1.5;
    border:1px solid rgba(0,180,255,0.3)
  }
  #attitude{
    position:absolute;bottom:18px;right:18px;width:92px;height:92px;border-radius:50%;
    border:3px solid #00aaff;overflow:hidden;background:#222
  }
  #horizon{
    position:absolute;width:200%;height:200%;top:-50%;left:-50%;
    background:linear-gradient(#4a90d9 0%,#4a90d9 49.5%,#fff 49.5%,#fff 50.5%,#8B5A2B 50.5%,#8B5A2B 100%);
    transform-origin:center
  }
  #cross{position:absolute;top:50%;left:50%;width:42px;height:2px;background:#0f0;transform:translate(-50%,-50%)}
  #cross:after{content:'';position:absolute;left:50%;top:-13px;width:2px;height:28px;background:#0f0}
</style>
</head>
<body>
<div id="ui">
  <div id="hud">
    <div><b>AIRCRAFT</b> <span id="acName">—</span></div>
    <div><b>IAS</b> <span id="spd">0</span> kts</div>
    <div><b>ALT</b> <span id="alt">0</span> ft</div>
    <div><b>VS</b> <span id="vs">0</span> fpm</div>
    <div><b>THR</b> <span id="thr">0</span>%</div>
    <div id="stallMsg" style="display:none" class="stall"><b>⚠ STALL</b></div>
  </div>

  <div id="selector">
    <h3>Select Aircraft</h3>
    <button data-ac="0" class="active">Cessna 172</button>
    <button data-ac="1">Piper Cherokee</button>
    <button data-ac="2">Citation Jet</button>
    <button data-ac="3">Boeing 737</button>
    <button data-ac="4">F-16 Falcon</button>
  </div>

  <div id="controls">
    <b>Controls</b><br>
    ↑ ↓ Pitch &nbsp; ← → Roll<br>
    A / D Yaw &nbsp; W / S Throttle<br>
    Space Boost &nbsp; R Reset
  </div>

  <div id="attitude"><div id="horizon"></div><div id="cross"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const AIRCRAFT = [
  {name:"Cessna 172", mass:1.0, wing:1.0, thrust:30, maxSpd:145, stall:50, roll:1.35, pitch:1.1, yaw:0.9, drag:0.017, color:0xf5f5f5, accent:0x1a4a9c, scale:1.0, type:"prop"},
  {name:"Piper Cherokee", mass:1.15, wing:1.05, thrust:34, maxSpd:155, stall:55, roll:1.25, pitch:1.0, yaw:0.85, drag:0.016, color:0xf0f0f0, accent:0xb81c1c, scale:1.05, type:"prop"},
  {name:"Citation Jet", mass:1.7, wing:0.9, thrust:58, maxSpd:430, stall:98, roll:1.55, pitch:1.25, yaw:1.0, drag:0.011, color:0xe8e8e8, accent:0x2a2a2a, scale:1.25, type:"jet"},
  {name:"Boeing 737", mass:4.8, wing:2.3, thrust:95, maxSpd:470, stall:135, roll:0.65, pitch:0.55, yaw:0.45, drag:0.013, color:0xffffff, accent:0x003399, scale:2.35, type:"airliner"},
  {name:"F-16 Falcon", mass:1.45, wing:0.72, thrust:100, maxSpd:950, stall:125, roll:2.9, pitch:2.3, yaw:1.7, drag:0.009, color:0x7a8a9a, accent:0x3a4a5a, scale:1.12, type:"fighter"}
];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6eb5e0);
scene.fog = new THREE.Fog(0x6eb5e0, 500, 4200);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.4, 9000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.05);
sun.position.set(500, 700, 250);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 10; sun.shadow.camera.far = 2500;
sun.shadow.camera.left = sun.shadow.camera.bottom = -800;
sun.shadow.camera.right = sun.shadow.camera.top = 800;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(7000,7000), new THREE.MeshLambertMaterial({color:0x3d8a45}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// Runway
const runway = new THREE.Mesh(new THREE.PlaneGeometry(70,1400), new THREE.MeshLambertMaterial({color:0x2a2a2a}));
runway.rotation.x = -Math.PI/2; runway.position.y = 0.12; runway.receiveShadow = true; scene.add(runway);
for(let i=-600;i<=600;i+=45){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.8,22), new THREE.MeshBasicMaterial({color:0xffffff}));
  m.rotation.x = -Math.PI/2; m.position.set(0,0.18,i); scene.add(m);
}

// Hills
for(let i=0;i<40;i++){
  const h = 50 + Math.random()*200;
  const hill = new THREE.Mesh(new THREE.ConeGeometry(60+Math.random()*90,h,8), new THREE.MeshLambertMaterial({color:0x2a6b32}));
  hill.position.set((Math.random()-0.5)*5500, h/2, (Math.random()-0.5)*5500);
  if(Math.abs(hill.position.x)<180 && Math.abs(hill.position.z)<800) continue;
  hill.castShadow = true; scene.add(hill);
}

function buildPlane(ac){
  const g = new THREE.Group();
  const s = ac.scale;
  const mat = new THREE.MeshLambertMaterial({color:ac.color});
  const acc = new THREE.MeshLambertMaterial({color:ac.accent});
  const dark = new THREE.MeshLambertMaterial({color:0x111122});

  let body;
  if(ac.type==="fighter"){
    body = new THREE.Mesh(new THREE.CylinderGeometry(0.32*s,0.22*s,5.8*s,12), mat);
    body.rotation.z = Math.PI/2;
  } else if(ac.type==="airliner"){
    body = new THREE.Mesh(new THREE.CylinderGeometry(0.52*s,0.42*s,10*s,14), mat);
    body.rotation.z = Math.PI/2;
  } else {
    body = new THREE.Mesh(new THREE.BoxGeometry(1.15*s,0.58*s,4.4*s), mat);
  }
  body.castShadow = true; g.add(body);

  const span = (ac.type==="airliner"?12:ac.type==="fighter"?6.8:7.8)*s;
  const wing = new THREE.Mesh(new THREE.BoxGeometry(span,0.11*s,1.7*s), mat);
  wing.position.y = 0.06*s; wing.castShadow = true; g.add(wing);

  // wingtips slight dihedral look
  const tipL = new THREE.Mesh(new THREE.BoxGeometry(0.8*s,0.08*s,0.9*s), mat);
  tipL.position.set(-span/2+0.3*s,0.15*s,0); tipL.rotation.z = 0.25; g.add(tipL);
  const tipR = tipL.clone(); tipR.position.x *= -1; tipR.rotation.z *= -1; g.add(tipR);

  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.11*s,1.4*s,1.2*s), mat);
  fin.position.set(0,0.75*s,-2.0*s); g.add(fin);
  const stab = new THREE.Mesh(new THREE.BoxGeometry(2.9*s,0.09*s,0.95*s), mat);
  stab.position.set(0,0.28*s,-2.1*s); g.add(stab);

  if(ac.type==="prop"){
    const prop = new THREE.Mesh(new THREE.BoxGeometry(0.07*s,1.7*s,0.14*s), acc);
    prop.position.set(0,0,2.4*s); prop.name="prop"; g.add(prop);
    const hub = new THREE.Mesh(new THREE.SphereGeometry(0.18*s,8,8), dark);
    hub.position.set(0,0,2.35*s); g.add(hub);
  } else if(ac.type==="jet" || ac.type==="fighter"){
    const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.2*s,0.26*s,1.9*s,10), acc);
    eng.rotation.z = Math.PI/2; eng.position.set(0,-0.18*s,-1.3*s); g.add(eng);
  } else {
    [-1,1].forEach(side=>{
      const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.26*s,0.3*s,1.7*s,10), acc);
      eng.rotation.z = Math.PI/2;
      eng.position.set(side*2.3*s,-0.55*s,0.4*s); g.add(eng);
    });
  }

  const cock = new THREE.Mesh(new THREE.BoxGeometry(0.72*s,0.42*s,1.15*s), dark);
  cock.position.set(0,0.38*s,1.0*s); g.add(cock);

  // simple nose
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.28*s,0.9*s,8), mat);
  nose.rotation.z = -Math.PI/2; nose.position.set(0,0,2.5*s); g.add(nose);

  return g;
}

let current = 0, plane = null, speed = 0, throttle = 0.45;
let pRate = 0, rRate = 0, yRate = 0;
const keys = {};

function spawn(idx){
  if(plane) scene.remove(plane);
  current = idx;
  const ac = AIRCRAFT[idx];
  plane = buildPlane(ac);
  plane.position.set(0, 28, 0);
  plane.rotation.set(0,0,0);
  scene.add(plane);
  speed = ac.stall * 0.55 * 0.514;
  throttle = 0.5; pRate = rRate = yRate = 0;
  document.getElementById("acName").textContent = ac.name;
  document.querySelectorAll("#selector button").forEach((b,i)=>b.classList.toggle("active",i===idx));
}

window.addEventListener("keydown", e=>{
  keys[e.code]=true;
  if(e.code==="KeyR") spawn(current);
});
window.addEventListener("keyup", e=>keys[e.code]=false);
document.querySelectorAll("#selector button").forEach(btn=>{
  btn.addEventListener("click",()=>spawn(+btn.dataset.ac));
});

function physics(dt){
  const ac = AIRCRAFT[current];
  const kts = speed / 0.514;

  if(keys["KeyW"]) throttle = Math.min(1, throttle+0.55*dt);
  if(keys["KeyS"]) throttle = Math.max(0, throttle-0.65*dt);
  if(keys["Space"]) throttle = Math.min(1, throttle+1.1*dt);

  const elev = (keys["ArrowUp"]?1:0)-(keys["ArrowDown"]?1:0);
  const ail  = (keys["ArrowLeft"]?1:0)-(keys["ArrowRight"]?1:0);
  const rud  = (keys["KeyA"]?1:0)-(keys["KeyD"]?1:0);
  const q = Math.min(1.5, Math.max(0.12, kts/110));

  pRate += elev * ac.pitch * q * 2.1 * dt;
  rRate += ail  * ac.roll  * q * 2.7 * dt;
  yRate += rud  * ac.yaw   * q * 1.7 * dt;
  pRate *= (1-2.7*dt); rRate *= (1-3.1*dt); yRate *= (1-2.4*dt);

  plane.rotation.x += pRate*dt;
  plane.rotation.z += rRate*dt;
  plane.rotation.y += yRate*dt;
  plane.rotation.x = Math.max(-1.25, Math.min(1.25, plane.rotation.x));

  const AoA = plane.rotation.x;
  const Cl = Math.sin(AoA*1.7)*1.35;
  const lift = 0.5*speed*speed*ac.wing*Cl*0.014;
  const drag = 0.5*speed*speed*ac.drag*(1+Math.abs(AoA)*1.7);
  const thrust = throttle * ac.thrust * (ac.type==="fighter" && throttle>0.88 ? 1.4 : 1);

  const accel = (thrust - drag)/ac.mass - 9.81*Math.sin(AoA)*0.07;
  speed += accel * dt * 17;
  speed = Math.max(0, Math.min(ac.maxSpd*0.514, speed));

  let vy = -9.81*0.11 + (lift/ac.mass)*Math.cos(AoA)*0.85;
  const stalled = kts < ac.stall*0.93 || (Math.abs(AoA)>0.52 && kts < ac.stall*1.35);
  if(stalled){
    vy -= 5.5*dt*18;
    speed *= (1-0.18*dt);
    document.getElementById("stallMsg").style.display = "block";
  } else document.getElementById("stallMsg").style.display = "none";

  const fwd = new THREE.Vector3(0,0,1).applyQuaternion(plane.quaternion);
  plane.position.addScaledVector(fwd, speed*dt);
  plane.position.y += vy*dt*11;

  if(plane.position.y < 3.8){
    plane.position.y = 3.8;
    if(Math.abs(plane.rotation.x)>0.38 || speed>40){ speed*=0.25; plane.rotation.x*=0.25; }
    else { speed*=0.991; plane.rotation.x*=0.88; }
  }
  if(plane.position.y > 2800) plane.position.y = 2800;
}

function updateCam(){
  const off = new THREE.Vector3(0,5.8,-17).applyQuaternion(plane.quaternion);
  camera.position.lerp(plane.position.clone().add(off), 0.11);
  camera.lookAt(plane.position);
}

let lastY = 28;
function hud(){
  const kts = speed/0.514;
  document.getElementById("spd").textContent = Math.round(kts);
  document.getElementById("alt").textContent = Math.round(plane.position.y*3.28084);
  document.getElementById("thr").textContent = Math.round(throttle*100);
  const vs = Math.round((plane.position.y - lastY)*3.28084*60);
  lastY = plane.position.y;
  document.getElementById("vs").textContent = vs;
  document.getElementById("horizon").style.transform =
    `rotate(${-plane.rotation.z*57.3}deg) translateY(${plane.rotation.x*42}px)`;
}

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  physics(dt); updateCam(); hud();
  const prop = plane.getObjectByName("prop");
  if(prop) prop.rotation.x += throttle*28*dt;
  renderer.render(scene, camera);
}

spawn(0);
window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
loop(performance.now());
</script>
</body>
</html>
