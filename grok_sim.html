<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D HTML5 Flight Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: monospace;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 16px;
            line-height: 1.5;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }
    </style>
    <!-- Include Three.js via CDN for 3D graphics rendering -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="hud">
        SPEED: <span id="speed-val">0</span> knots<br>
        ALTITUDE: <span id="alt-val">0</span> ft<br>
        PITCH: <span id="pitch-val">0</span>°<br>
        ROLL: <span id="roll-val">0</span>°
    </div>

    <div id="controls">
        Controls: <b>W/S</b>: Pitch Down/Up | <b>A/D</b>: Roll Left/Right | <b>Q/E</b>: Yaw Left/Right | <b>R/F</b>: Throttle Up/Down
    </div>

    <script>
        // --- 1. SETUP SCENE & CAMERA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 300, 100);
        scene.add(dirLight);

        // --- 3. PROCEDURAL TERRAIN ---
        // Generates simple rolling hills using a sine/cosine matrix
        const terrainSize = 2000;
        const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, 64, 64);
        geometry.rotateX(-Math.PI / 2); // Make it horizontal

        const position = geometry.attributes.position;
        for (let i = 0; i < position.count; i++) {
            const x = position.getX(i);
            const z = position.getZ(i);
            // Create a procedural wave height landscape
            const y = Math.sin(x * 0.01) * Math.cos(z * 0.01) * 30 + Math.sin(x * 0.002) * 50;
            position.setY(i, y);
        }
        geometry.computeVertexNormals();

        const material = new THREE.MeshLambertMaterial({ 
            color: 0x228B22, // Forest Green
            wireframe: false,
            flatShading: true
        });
        const terrain = new THREE.Mesh(geometry, material);
        scene.add(terrain);

        // Add some basic low-poly runway blocks to give perspective
        const runwayGeo = new THREE.BoxGeometry(40, 1, 400);
        const runwayMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const runway = new THREE.Mesh(runwayGeo, runwayMat);
        runway.position.set(0, -2, -200);
        scene.add(runway);

        // --- 4. FLIGHT PHYSICS & VARIABLES ---
        // Initial setup placing the camera inside an imaginary cockpit
        camera.position.set(0, 50, 100); 
        
        let speed = 50;         // Forward speed units
        let maxSpeed = 150;
        let minSpeed = 10;
        
        // Flight dynamics coefficients
        let pitchVelocity = 0;
        let rollVelocity = 0;
        let yawVelocity = 0;

        const rotationDamping = 0.85;
        const controlResponsiveness = 0.002;

        // Input monitoring state
        const keys = { w: false, s: false, a: false, d: false, q: false, e: false, r: false, f: false };

        // --- 5. INPUT LISTENERS ---
        window.addEventListener('keydown', (e) => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
        });
        
        window.addEventListener('keyup', (e) => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        // Window resize compliance
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 6. DOM UI UPDATES ---
        const speedEl = document.getElementById('speed-val');
        const altEl = document.getElementById('alt-val');
        const pitchEl = document.getElementById('pitch-val');
        const rollEl = document.getElementById('roll-val');

        function updateHUD() {
            speedEl.innerText = Math.round(speed);
            altEl.innerText = Math.round(camera.position.y * 10); // Scale value for presentation
            
            // Convert radians to degrees for cockpit instrumentation
            const pitchDeg = Math.round((camera.rotation.x * 180) / Math.PI);
            const rollDeg = Math.round((camera.rotation.z * 180) / Math.PI);
            
            pitchEl.innerText = pitchDeg;
            rollEl.innerText = rollDeg;
        }

        // --- 7. MAIN SIMULATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Throttle Management
            if (keys.r) speed = Math.min(speed + 0.5, maxSpeed);
            if (keys.f) speed = Math.max(speed - 0.5, minSpeed);

            // Standard aircraft control logic (Pitch, Roll, Yaw)
            if (keys.w) pitchVelocity -= controlResponsiveness; // Nose down
            if (keys.s) pitchVelocity += controlResponsiveness; // Nose up
            if (keys.a) rollVelocity += controlResponsiveness;  // Roll left
            if (keys.d) rollVelocity -= controlResponsiveness;  // Roll right
            if (keys.q) yawVelocity += controlResponsiveness;   // Rudder left
            if (keys.e) yawVelocity -= controlResponsiveness;   // Rudder right

            // Apply dampening to flight controls so stick returns smoothly
            pitchVelocity *= rotationDamping;
            rollVelocity *= rotationDamping;
            yawVelocity *= rotationDamping;

            // Apply rotations locally onto the camera space
            camera.rotateX(pitchVelocity);
            camera.rotateZ(rollVelocity);
            camera.rotateY(yawVelocity);

            // Calculate forward movement vector using current pitch and headings
            const forwardVector = new THREE.Vector3(0, 0, -1);
            forwardVector.applyQuaternion(camera.quaternion);
            forwardVector.multiplyScalar(speed * 0.1); // Scaled delta step

            // Update flight vector position
            camera.position.add(forwardVector);

            // Ground collision fallback constraints
            if (camera.position.y < 5) {
                camera.position.y = 5;
                speed = Math.max(speed - 1, minSpeed); // Friction penalty on impact
            }

            // Endless looping boundary reset so player never runs off terrain edge
            if (Math.abs(camera.position.x) > terrainSize / 2) camera.position.x = -camera.position.x;
            if (Math.abs(camera.position.z) > terrainSize / 2) camera.position.z = -camera.position.z;

            // Engine Frame Processes
            updateHUD();
            renderer.render(scene, camera);
        }

        // Engage simulation loop
        animate();
    </script>
</body>
</html>
